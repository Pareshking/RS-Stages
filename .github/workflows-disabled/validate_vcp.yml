name: Validate VCP Footprints

# One-off, manual. Checks the v2.3 detector against footprints published in the
# source, using two stocks still listed with history covering the period.
#
# It lives in CI rather than in the test suite for one reason: it needs the
# network. The development sandbox cannot reach Yahoo, and a test that silently
# skips when offline is worse than no test — it reports green while checking
# nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compare the detector against the source's own footprints
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/validate_vcp_footprints.py
