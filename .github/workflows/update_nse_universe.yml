name: Update Nifty Total Market Universe

on:
  workflow_dispatch:
  schedule:
    # 23:30 IST = 18:00 UTC, every Friday.
    - cron: "0 18 * * 5"

permissions:
  contents: write

jobs:
  update-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pandas

      - name: Download Nifty Total Market constituent CSV
        env:
          CSV_URL: https://www.niftyindices.com/IndexConstituent/ind_niftytotalmarket_list.csv
        run: |
          set -euo pipefail
          mkdir -p data
          tmp_file="data/ind_niftytotalmarket_list.csv.tmp"
          curl --fail --location --retry 3 --retry-delay 5 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            -H 'Referer: https://www.niftyindices.com/' \
            -o "$tmp_file" \
            "$CSV_URL"
          test -s "$tmp_file"
          head -n 3 "$tmp_file"

      - name: Validate universe CSV before replacement
        run: |
          python - <<'PY'
          import re
          import pandas as pd
          p = "data/ind_niftytotalmarket_list.csv.tmp"
          df = pd.read_csv(p)
          required = {"Symbol", "Industry", "Company Name"}
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f"Missing required columns: {sorted(missing)}")
          if df.empty:
              raise SystemExit("Universe CSV is empty")
          if df["Symbol"].isna().any() or df["Industry"].isna().any() or df["Company Name"].isna().any():
              raise SystemExit("Universe contains missing Symbol/Industry/Company Name values")
          symbols = df["Symbol"].astype(str).str.strip()
          if (symbols == "").any() or symbols.str.contains(r"\s", regex=True).any():
              raise SystemExit("Universe contains blank or whitespace-contaminated symbols")
          if df["Symbol"].duplicated().any():
              raise SystemExit("Universe contains duplicate symbols")
          if len(df) < 700:
              raise SystemExit(f"Unexpectedly small Nifty Total Market universe: {len(df)}")
          dummy_count = int(symbols.str.startswith("DUMMY").sum())
          acquisition_count = len(df) - dummy_count
          print(f"Validated source constituents: {len(df)}")
          print(f"DUMMY symbols excluded from acquisition: {dummy_count}")
          print(f"Acquisition universe: {acquisition_count}")
          PY
          mv data/ind_niftytotalmarket_list.csv.tmp data/ind_niftytotalmarket_list.csv

      - name: Commit refreshed universe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ind_niftytotalmarket_list.csv
          if git diff --cached --quiet; then
            echo 'No universe change.'
            exit 0
          fi
          git commit -m 'data: refresh Nifty Total Market constituents'
          git push
