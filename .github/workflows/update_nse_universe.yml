name: Update Nifty Total Market Universe

on:
  workflow_dispatch:
  schedule:
    # 23:00 IST = 17:30 UTC, every Friday — deliberately half an hour ahead of
    # the weekday research audit at 18:00 UTC. Two reasons, both real:
    #
    #   * The audit checks out the repository at its own start, so a universe
    #     published at the same minute would not reach the audit until the
    #     following run. Landing first means Friday's audit analyses Friday's
    #     constituent list.
    #   * Both workflows push to main. This one finishes in about 20 seconds
    #     and the audit takes about three minutes, so sharing a fire minute
    #     rejected the audit's push non-fast-forward every Friday.
    #
    # Enforced by tests/test_workflow_scheduling.py.
    - cron: "30 17 * * 5"

permissions:
  contents: write

jobs:
  update-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: the commit step rebases if main moved, and a depth-1
          # clone carries no merge base to rebase onto.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check pandas

      - name: Download Nifty Total Market constituent CSV
        env:
          CSV_URL: https://www.niftyindices.com/IndexConstituent/ind_niftytotalmarket_list.csv
        run: |
          set -euo pipefail
          mkdir -p data
          tmp_file="data/ind_niftytotalmarket_list.csv.tmp"
          curl --fail --location --retry 3 --retry-delay 5 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            -H 'Referer: https://www.niftyindices.com/' \
            -o "$tmp_file" \
            "$CSV_URL"
          test -s "$tmp_file"
          head -n 3 "$tmp_file"

      - name: Validate universe CSV before replacement
        run: |
          python - <<'PY'
          import re
          import pandas as pd
          p = "data/ind_niftytotalmarket_list.csv.tmp"
          df = pd.read_csv(p)
          required = {"Symbol", "Industry", "Company Name"}
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f"Missing required columns: {sorted(missing)}")
          if df.empty:
              raise SystemExit("Universe CSV is empty")
          if df["Symbol"].isna().any() or df["Industry"].isna().any() or df["Company Name"].isna().any():
              raise SystemExit("Universe contains missing Symbol/Industry/Company Name values")
          symbols = df["Symbol"].astype(str).str.strip()
          if (symbols == "").any() or symbols.str.contains(r"\s", regex=True).any():
              raise SystemExit("Universe contains blank or whitespace-contaminated symbols")
          if df["Symbol"].duplicated().any():
              raise SystemExit("Universe contains duplicate symbols")
          if len(df) < 700:
              raise SystemExit(f"Unexpectedly small Nifty Total Market universe: {len(df)}")
          dummy_count = int(symbols.str.startswith("DUMMY").sum())
          acquisition_count = len(df) - dummy_count
          print(f"Validated source constituents: {len(df)}")
          print(f"DUMMY symbols excluded from acquisition: {dummy_count}")
          print(f"Acquisition universe: {acquisition_count}")
          PY
          mv data/ind_niftytotalmarket_list.csv.tmp data/ind_niftytotalmarket_list.csv

      - name: Commit refreshed universe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ind_niftytotalmarket_list.csv
          if git diff --cached --quiet; then
            echo 'No universe change.'
            exit 0
          fi
          git commit -m 'data: refresh Nifty Total Market constituents'

          # Rebase rather than fail if main moved while this ran. This job
          # writes only the constituent CSV and the research audit writes only
          # its three output CSVs, so the rebase cannot conflict.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Universe published on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main (attempt $attempt)."
            git pull --rebase origin main
          done
          echo 'Could not publish the refreshed universe after 5 attempts.' >&2
          exit 1
