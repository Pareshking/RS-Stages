name: Quantitative Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile application and package
        run: python -m compileall -q app.py app_v4.py rs_stages tests
      - name: Streamlit production smoke test
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          url = "http://127.0.0.1:8501/"
          last = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      if response.status == 200:
                          print("Streamlit HTTP server is healthy")
                          raise SystemExit(0)
              except Exception as exc:
                  last = exc
              time.sleep(1)
          print("Streamlit HTTP server did not become ready:", last)
          print(open("/tmp/streamlit.log", encoding="utf-8").read())
          raise SystemExit(1)
          PY
          sleep 3
          if grep -Eiq 'Traceback|AttributeError|ModuleNotFoundError|SyntaxError|ImportError' /tmp/streamlit.log; then
            cat /tmp/streamlit.log
            exit 1
          fi
          cat /tmp/streamlit.log
      - name: Run tests
        run: python -m pytest -q
