name: Audit Watchdog

on:
  # Keep the watchdog away from :00 as well. It runs after the audit target and
  # checks the actual published artifact, not merely whether a workflow existed.
  schedule:
    - cron: "17 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  DATA_TAG: data-latest

jobs:
  check-and-retrigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check published price-panel freshness
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today=$(date -u +%Y-%m-%d)
          asset_date=$(gh api "repos/${{ github.repository }}/releases/tags/$DATA_TAG" \
            --jq '.assets[] | select(.name=="price_panel.npz") | .updated_at' | cut -c1-10 || true)

          echo "today=$today"
          echo "price_panel_updated=${asset_date:-missing}"

          if [ "$asset_date" = "$today" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-trigger the audit when the artifact is stale
        if: steps.check.outputs.fresh != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "data-latest/price_panel.npz is stale; dispatching a fresh audit."
          gh workflow run real_data_audit.yml --ref main
          echo "Fresh audit dispatched."

      - name: Confirm workflow dispatch is supported by the repository token
        if: steps.check.outputs.fresh != 'true'
        run: |
          echo "workflow_dispatch is triggered with GITHUB_TOKEN; no PAT secret is required."
