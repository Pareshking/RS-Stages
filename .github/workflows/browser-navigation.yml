name: Browser Navigation Regression

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install application dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Install Playwright
        run: python -m pip install playwright && python -m playwright install --with-deps chromium

      - name: Start Streamlit
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          echo $! > /tmp/streamlit.pid

      - name: Wait for Streamlit
        run: |
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8501/", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          print(open("/tmp/streamlit.log", encoding="utf-8").read())
          raise SystemExit("Streamlit did not become ready")
          PY

      - name: Run browser navigation regression
        env:
          RS_STAGES_TEST_URL: http://127.0.0.1:8501
        run: python -m pytest -q tests/test_browser_navigation.py

      - name: Dump Streamlit log on failure
        if: failure()
        run: cat /tmp/streamlit.log

      - name: Stop Streamlit
        if: always()
        run: kill "$(cat /tmp/streamlit.pid)" 2>/dev/null || true
