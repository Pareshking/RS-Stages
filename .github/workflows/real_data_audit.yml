name: Real Data Research Audit

on:
  workflow_dispatch:
    inputs:
      decision_date:
        description: 'Pre-market decision date (YYYY-MM-DD)'
        required: true
        type: string
      start_date:
        description: 'Yahoo history start (YYYY-MM-DD)'
        required: true
        type: string
      end_date:
        description: 'Yahoo history end (YYYY-MM-DD, exclusive)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run complete Nifty Total Market audit
        run: |
          python scripts/real_data_audit.py \
            --universe data/ind_niftytotalmarket_list.csv \
            --decision-date '${{ inputs.decision_date }}' \
            --start '${{ inputs.start_date }}' \
            --end '${{ inputs.end_date }}' \
            --output real_data_audit.csv

      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: real-data-audit-${{ inputs.decision_date }}
          path: real_data_audit.csv
          retention-days: 30
