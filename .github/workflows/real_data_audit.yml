name: Real Data Research Audit

on:
  # Keep the normal morning run away from :00, where GitHub documents the
  # highest scheduler load and possible dropped scheduled events.
  # Keep the audit workflow file in the push trigger below: operational changes
  # to acquisition/provider mapping intentionally launch one immediate recovery run.
  schedule:
    - cron: "17 1 * * 2-6"
  # A workflow-file change is an intentional recovery/validation trigger. It
  # lets an operational fix immediately prove the complete publication path
  # instead of waiting for the next scheduled window.
  push:
    branches: [main]
    paths:
      - ".github/workflows/real_data_audit.yml"
  workflow_dispatch:
    inputs:
      decision_date:
        description: 'Optional pre-market decision date (YYYY-MM-DD). Leave blank to use today in IST.'
        required: false
        type: string
      start_date:
        description: 'Optional Yahoo history start (YYYY-MM-DD). Leave blank for automatic warm-up history.'
        required: false
        type: string
      end_date:
        description: 'Optional Yahoo history end (YYYY-MM-DD, exclusive). Leave blank for automatic end date.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: rs-stages-real-data-audit
  cancel-in-progress: false

env:
  DATA_TAG: data-latest

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run complete Nifty Total Market audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p data
          python scripts/real_data_audit.py \
            --universe data/ind_niftytotalmarket_list.csv \
            --decision-date '${{ inputs.decision_date }}' \
            --start '${{ inputs.start_date }}' \
            --end '${{ inputs.end_date }}' \
            --output data/latest_research.csv

      # Commit the validated snapshot first. This ordering guarantees the
      # rolling release can never become newer than the committed research
      # snapshot if the git publication fails.
      - name: Publish validated research snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_research.csv \
                  data/previous_research.csv \
                  data/breadth_history.csv
          if git diff --cached --quiet; then
            echo "Validated research snapshot unchanged; continuing because the price panel still requires publication."
          else
            git commit -m "data: publish validated research snapshot"
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Snapshot published on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Could not publish the research snapshot after 5 attempts." >&2
                exit 1
              fi
              echo "Push rejected; rebasing onto origin/main (attempt $attempt)."
              git pull --rebase origin main
            done
          fi

      - name: Publish price panel as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$DATA_TAG" >/dev/null 2>&1; then
            gh release create "$DATA_TAG" \
              --title "Latest research price panel" \
              --notes "Rolling price panel for the RS-Stages terminal. Replaced by each Real Data Research Audit run; not a source release." \
              --latest=false
          fi

          # --clobber is intentionally retained: GitHub requires the existing
          # same-name asset to be replaced. Retry transient upload failures.
          for attempt in 1 2 3; do
            if gh release upload "$DATA_TAG" data/price_panel.npz --clobber; then
              echo "Price panel uploaded on attempt $attempt."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Price panel upload failed after 3 attempts." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify published price panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          local_sha=$(sha256sum data/price_panel.npz | awk '{print $1}')
          remote_sha=$(gh api "repos/${{ github.repository }}/releases/tags/$DATA_TAG" \
            --jq '.assets[] | select(.name=="price_panel.npz") | .digest' | sed 's/^sha256://')
          remote_size=$(gh api "repos/${{ github.repository }}/releases/tags/$DATA_TAG" \
            --jq '.assets[] | select(.name=="price_panel.npz") | .size')
          local_size=$(stat -c '%s' data/price_panel.npz)
          test -n "$remote_sha"
          test "$local_sha" = "$remote_sha"
          test "$local_size" = "$remote_size"
          echo "Verified price panel publication: sha256=$local_sha size=$local_size"

      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: real-data-audit-${{ inputs.decision_date || 'auto' }}
          path: |
            data/latest_research.csv
            data/previous_research.csv
            data/price_panel.npz
            data/breadth_history.csv
          retention-days: 30
