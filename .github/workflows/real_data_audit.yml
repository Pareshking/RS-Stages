name: Real Data Research Audit

on:
  # 02:30 UTC is 8:00 IST the *next* calendar day — run the morning after each
  # session, not the same evening. Three consecutive sessions (24->25, 25->26,
  # 26->27 Aug 2026) found the price provider still hadn't posted the day's
  # close by 23:45 IST same-day, so the run fell back to the prior session
  # every time. Moving to the next morning gives the provider roughly 16 hours
  # after the 15:30 IST close instead of about 8, which is the actual fix —
  # the boundary logic was never wrong, the provider just needed more time
  # than a same-evening run gave it. See DECISION_LOG D-2.2.12.
  #
  # Moved again from 01:00 to 02:30 UTC (D-2.2.14). The next-morning run still
  # found the provider had published the latest session for only a third of the
  # universe: 261 of 750 on the 29 Aug 2026 run, leaving 489 stocks a session
  # behind inside one cross-sectional RS ranking. 90 more minutes is the
  # cheapest thing to try, and it stays well inside the pre-market window — the
  # run needs about three minutes and the NSE opens at 09:15 IST / 03:45 UTC,
  # so publication lands around 08:20 IST with an hour to spare.
  #
  # Whether 90 minutes is enough is a question about a third party's publishing
  # curve, and arguing about it is worth less than measuring it: every run now
  # appends its own split to data/freshness_history.csv and warns when the
  # lagging share exceeds MAX_LAGGING_SHARE, so the next move is made from
  # evidence rather than from another estimate.
  #
  # Day-of-week is shifted by one accordingly: a Monday session is picked up
  # Tuesday morning, ... a Friday session Saturday morning. Mon-Fri sessions
  # therefore need Tue-Sat runs (Sunday and Monday mornings have no preceding
  # session to fetch). The universe refresh still fires Friday 17:15 UTC; it
  # is now the *Saturday* run that lands after it with margin, not a same-day
  # Friday one — see tests/test_workflow_scheduling.py.
  schedule:
    - cron: "30 2 * * 2-6"
  workflow_dispatch:
    inputs:
      decision_date:
        description: 'Optional pre-market decision date (YYYY-MM-DD). Leave blank to use today in IST.'
        required: false
        type: string
      start_date:
        description: 'Optional Yahoo history start (YYYY-MM-DD). Leave blank for automatic warm-up history.'
        required: false
        type: string
      end_date:
        description: 'Optional Yahoo history end (YYYY-MM-DD, exclusive). Leave blank for automatic end date.'
        required: false
        type: string

permissions:
  contents: write

env:
  # Rolling tag whose single asset is replaced on every run. Deliberately not a
  # source release: it carries generated data, never code.
  DATA_TAG: data-latest

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: publishing rebases onto whatever landed while this run
          # was computing, and a depth-1 clone has no merge base to rebase onto.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run complete Nifty Total Market audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p data
          python scripts/real_data_audit.py \
            --universe data/ind_niftytotalmarket_list.csv \
            --decision-date '${{ inputs.decision_date }}' \
            --start '${{ inputs.start_date }}' \
            --end '${{ inputs.end_date }}' \
            --output data/latest_research.csv

      # The price panel is published as a release asset, never committed. It is a
      # regenerated binary that Git cannot delta, so committing it would add a
      # fresh ~1.4 MB blob to history on every run, permanently. Replacing a
      # single asset keeps exactly one copy and adds nothing to the repository.
      - name: Publish price panel as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$DATA_TAG" >/dev/null 2>&1; then
            gh release create "$DATA_TAG" \
              --title "Latest research price panel" \
              --notes "Rolling price panel for the RS-Stages terminal. Replaced by each Real Data Research Audit run; not a source release." \
              --latest=false
          fi
          gh release upload "$DATA_TAG" data/price_panel.npz --clobber
          echo "Published $(du -h data/price_panel.npz | cut -f1) panel to release $DATA_TAG"

      - name: Publish validated research snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_research.csv \
                  data/previous_research.csv \
                  data/breadth_history.csv \
                  data/freshness_history.csv
          if git diff --cached --quiet; then
            echo "Validated research snapshot unchanged."
            exit 0
          fi
          git commit -m "data: publish validated research snapshot"

          # This job runs for about three minutes, so main can move underneath
          # it — a human commit, or the Friday universe refresh. A bare push is
          # then rejected non-fast-forward and the run dies at its very last
          # step, having *already* replaced the price panel on the release. The
          # published panel would sit one session ahead of the committed
          # snapshot, which is precisely the drift panel_matches() refuses to
          # draw through: the live terminal loses every chart until someone
          # re-runs by hand.
          #
          # The audit writes only its own four CSVs and the universe refresh
          # writes only the constituent list, so rebasing onto whatever landed
          # can never conflict.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Snapshot published on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main (attempt $attempt)."
            git pull --rebase origin main
          done
          echo "Could not publish the research snapshot after 5 attempts." >&2
          exit 1

      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: real-data-audit-${{ inputs.decision_date || 'auto' }}
          path: |
            data/latest_research.csv
            data/previous_research.csv
            data/price_panel.npz
            data/breadth_history.csv
            data/freshness_history.csv
          retention-days: 30
